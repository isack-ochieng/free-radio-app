name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Run tests and build optimized release variants
        run: |
          gradle testPlayDebugUnitTest testSystemDebugUnitTest assemblePlayRelease assembleSystemRelease -PciDebugSigning=true

      - name: Report optimized APK sizes
        run: |
          stat -c "%n %s bytes" app/build/outputs/apk/play/release/app-play-release.apk
          stat -c "%n %s bytes" app/build/outputs/apk/system/release/app-system-release.apk

      - name: Package privileged system install module
        run: |
          set -euo pipefail
          mkdir -p build/radio-magisk/system/system_ext/priv-app/Radio
          mkdir -p build/radio-magisk/system/system_ext/etc/permissions
          cp app/build/outputs/apk/system/release/app-system-release.apk build/radio-magisk/system/system_ext/priv-app/Radio/Radio.apk
          cp system-integration/privapp-permissions-tech-iox-radio.xml build/radio-magisk/system/system_ext/etc/permissions/
          cp system-integration/module.prop build/radio-magisk/module.prop
          cd build/radio-magisk
          zip -qr ../radio-system-magisk.zip .

      - name: Upload optimized APKs, mappings and system module
        uses: actions/upload-artifact@v4
        with:
          name: radio-0.3.0-release
          path: |
            app/build/outputs/apk/play/release/app-play-release.apk
            app/build/outputs/apk/system/release/app-system-release.apk
            app/build/outputs/mapping/playRelease/mapping.txt
            app/build/outputs/mapping/systemRelease/mapping.txt
            build/radio-system-magisk.zip
          if-no-files-found: error
          retention-days: 30
